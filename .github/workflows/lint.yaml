name: golangci-lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable" # Automatically grabs the latest stable version of Go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Optional: specify a fixed linter version, or it defaults to the latest
          version: linter
